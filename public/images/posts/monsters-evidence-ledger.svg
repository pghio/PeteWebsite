<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 812" role="img" aria-labelledby="title desc" font-family="'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Both things can be true: the evidence on young workers and AI</title>
  <desc id="desc">A ledger of five findings. Stanford's payroll-records dashboard finds young workers faring worse in highly AI-exposed occupations, which supports the alarm. Yale's Budget Lab finds the occupational mix changing about one percentage point faster than early internet adoption. A Federal Reserve note finds no association between AI adoption and fewer job postings. New York Fed researchers estimate remote work explains 64 percent of the recent rise in young-graduate unemployment. Recent graduates faced 5.7 percent unemployment and 41.5 percent underemployment in the first quarter of 2026, a deterioration that tracks back years rather than months.</desc>

  <rect width="1200" height="812" fill="#F5F1E6"/>

  <text x="72" y="55" fill="#586185" font-size="16" font-weight="600">Reading the evidence</text>
  <text x="72" y="108" fill="#1E2A48" font-size="45" font-weight="700">Both things can be true.</text>
  <text x="72" y="146" fill="#586185" font-size="18">What the data actually says about young workers and AI — on both sides of the ledger.</text>

  <line x1="72" y1="180" x2="1128" y2="180" stroke="#D3CBB9" stroke-width="2"/>

  <text x="72" y="212" fill="#586185" font-size="14" font-weight="600">Source</text>
  <text x="300" y="212" fill="#586185" font-size="14" font-weight="600">What it found</text>
  <text x="1029" y="212" fill="#586185" font-size="14" font-weight="600" text-anchor="middle">Which way it cuts</text>

  <line x1="72" y1="228" x2="1128" y2="228" stroke="#D3CBB9" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="72" y="268" fill="#1E2A48" font-size="17" font-weight="700">Stanford</text>
  <text x="72" y="290" fill="#586185" font-size="14">Canaries dashboard</text>
  <text x="72" y="309" fill="#586185" font-size="14">payroll records</text>
  <text x="300" y="268" fill="#1E2A48" font-size="16">Young workers are faring worse in highly AI-exposed</text>
  <text x="300" y="291" fill="#1E2A48" font-size="16">occupations — concentrated where the technology appears</text>
  <text x="300" y="314" fill="#1E2A48" font-size="16">to automate rather than assist.</text>
  <rect x="930" y="266" width="198" height="30" rx="15" fill="#B73720"/>
  <text x="1029" y="286" fill="#F5F1E6" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">THE ALARM IS REAL</text>

  <line x1="72" y1="338" x2="1128" y2="338" stroke="#D3CBB9" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="72" y="378" fill="#1E2A48" font-size="17" font-weight="700">Yale Budget Lab</text>
  <text x="72" y="400" fill="#586185" font-size="14">occupational mix</text>
  <text x="300" y="378" fill="#1E2A48" font-size="16">The AI-era occupational mix is changing only about</text>
  <text x="300" y="401" fill="#1E2A48" font-size="16"><tspan font-size="20" font-weight="700">1 percentage point</tspan>&#160;faster than during early internet</text>
  <text x="300" y="424" fill="#1E2A48" font-size="16">adoption — not outside historical patterns.</text>
  <rect x="930" y="376" width="198" height="30" rx="15" fill="#2F5597"/>
  <text x="1029" y="396" fill="#F5F1E6" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">NOT UNPRECEDENTED</text>

  <line x1="72" y1="448" x2="1128" y2="448" stroke="#D3CBB9" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="72" y="488" fill="#1E2A48" font-size="17" font-weight="700">Federal Reserve</text>
  <text x="72" y="510" fill="#586185" font-size="14">FEDS Note, 2026</text>
  <text x="300" y="488" fill="#1E2A48" font-size="16">No association between greater AI adoption or exposure</text>
  <text x="300" y="511" fill="#1E2A48" font-size="16">and fewer subsequent job postings, in firm- or</text>
  <text x="300" y="534" fill="#1E2A48" font-size="16">industry-level totals.</text>
  <rect x="930" y="486" width="198" height="30" rx="15" fill="#2F5597"/>
  <text x="1029" y="506" fill="#F5F1E6" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">NOT UNPRECEDENTED</text>

  <line x1="72" y1="558" x2="1128" y2="558" stroke="#D3CBB9" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="72" y="598" fill="#1E2A48" font-size="17" font-weight="700">New York Fed</text>
  <text x="72" y="620" fill="#586185" font-size="14">Liberty Street</text>
  <text x="300" y="598" fill="#1E2A48" font-size="16">Remote work can explain&#160;<tspan font-size="20" font-weight="700">64%</tspan>&#160;of the recent rise in</text>
  <text x="300" y="621" fill="#1E2A48" font-size="16">unemployment among young college graduates: distributed</text>
  <text x="300" y="644" fill="#1E2A48" font-size="16">teams are harder places to train beginners.</text>
  <rect x="930" y="596" width="198" height="30" rx="15" fill="#2F5597"/>
  <text x="1029" y="616" fill="#F5F1E6" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">ANOTHER CAUSE</text>

  <line x1="72" y1="668" x2="1128" y2="668" stroke="#D3CBB9" stroke-width="1"/>

  <!-- Row 5 -->
  <text x="72" y="706" fill="#1E2A48" font-size="17" font-weight="700">New York Fed</text>
  <text x="72" y="726" fill="#586185" font-size="14">Q1 2026</text>
  <text x="300" y="700" fill="#1E2A48" font-size="16">Recent graduates:&#160;<tspan font-size="20" font-weight="700">5.7%</tspan>&#160;unemployment,&#160;<tspan font-size="20" font-weight="700">41.5%</tspan>&#160;underemployment.</text>
  <text x="300" y="723" fill="#1E2A48" font-size="16">Bad numbers — but the deterioration tracks back across years, not months.</text>
  <rect x="930" y="698" width="198" height="30" rx="15" fill="#586185"/>
  <text x="1029" y="718" fill="#F5F1E6" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">BOTH AT ONCE</text>

  <line x1="72" y1="752" x2="1128" y2="752" stroke="#D3CBB9" stroke-width="1"/>
  <text x="72" y="780" fill="#1E2A48" font-size="16" font-weight="700">The evidence is more complicated than the speeches.</text>
  <text x="72" y="800" fill="#586185" font-size="13">Sources: Stanford Digital Economy Lab · Yale Budget Lab · Federal Reserve Board FEDS Notes · Federal Reserve Bank of New York.</text>
</svg>
