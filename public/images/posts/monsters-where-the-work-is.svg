<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">The ground is still there: projected annual openings in construction and repair work</title>
  <desc id="desc">Bureau of Labor Statistics projections for 2024 to 2034. Construction and extraction occupations show about 649,300 projected openings a year at a median wage of $58,360, above the $49,500 median across all occupations. Installation, maintenance and repair adds about 608,100 openings a year at a similar median wage. Inside those groups, electricians show about 81,000 openings a year, plumbers, pipefitters and steamfitters about 44,000, and electrical power-line installers about 10,700 at a median wage above $92,000. These are projected openings from growth and replacement, not live vacancies.</desc>

  <rect width="1200" height="800" fill="#F5F1E6"/>

  <text x="72" y="55" fill="#586185" font-size="16" font-weight="600">The work the old map left out</text>
  <text x="72" y="108" fill="#1E2A48" font-size="45" font-weight="700">The ground is still there.</text>
  <text x="72" y="146" fill="#586185" font-size="18">Projected openings each year, 2024–34, and what the work pays.</text>

  <line x1="72" y1="180" x2="1128" y2="180" stroke="#D3CBB9" stroke-width="2"/>

  <!-- Tier 1 -->
  <text x="72" y="212" fill="#586185" font-size="14" font-weight="600">TWO OCCUPATIONAL GROUPS</text>

  <text x="72" y="256" fill="#1E2A48" font-size="20" font-weight="700">Construction and extraction</text>
  <text x="72" y="279" fill="#586185" font-size="15">median wage&#160;<tspan fill="#1E2A48" font-weight="700">$58,360</tspan></text>
  <rect x="450" y="238" width="600" height="40" fill="#2F5597"/>
  <text x="1063" y="266" fill="#1E2A48" font-size="26" font-weight="700">649,300</text>

  <text x="72" y="342" fill="#1E2A48" font-size="20" font-weight="700">Installation, maintenance, repair</text>
  <text x="72" y="365" fill="#586185" font-size="15">median wage&#160;<tspan fill="#1E2A48" font-weight="700">$58,230</tspan></text>
  <rect x="450" y="324" width="562" height="40" fill="#2F5597"/>
  <text x="1063" y="352" fill="#1E2A48" font-size="26" font-weight="700">608,100</text>

  <!-- All-occupation median reference -->
  <text x="72" y="410" fill="#586185" font-size="15">For reference, the median wage across&#160;<tspan font-weight="700">all</tspan>&#160;U.S. occupations is&#160;<tspan fill="#B73720" font-size="18" font-weight="700">$49,500</tspan>&#160;— below both groups above.</text>

  <line x1="72" y1="436" x2="1128" y2="436" stroke="#D3CBB9" stroke-width="1.5"/>

  <!-- Tier 2 -->
  <text x="72" y="468" fill="#586185" font-size="14" font-weight="600">INSIDE THOSE GROUPS — INDIVIDUAL TRADES</text>
  <text x="72" y="490" fill="#9A9CA8" font-size="13" font-style="italic">Subsets of the totals above, on their own scale.</text>

  <text x="72" y="532" fill="#1E2A48" font-size="18" font-weight="700">Electricians</text>
  <text x="72" y="553" fill="#586185" font-size="14">median $62,350</text>
  <rect x="450" y="518" width="300" height="30" fill="#7A93C4"/>
  <text x="766" y="541" fill="#1E2A48" font-size="20" font-weight="700">81,000</text>

  <text x="72" y="592" fill="#1E2A48" font-size="18" font-weight="700">Plumbers, pipefitters, steamfitters</text>
  <text x="72" y="613" fill="#586185" font-size="14">median $62,970</text>
  <rect x="450" y="578" width="163" height="30" fill="#7A93C4"/>
  <text x="629" y="601" fill="#1E2A48" font-size="20" font-weight="700">44,000</text>

  <text x="72" y="652" fill="#1E2A48" font-size="18" font-weight="700">Electrical power-line installers</text>
  <text x="72" y="673" fill="#B73720" font-size="14" font-weight="700">median $92,560</text>
  <rect x="450" y="638" width="40" height="30" fill="#7A93C4"/>
  <text x="506" y="661" fill="#1E2A48" font-size="20" font-weight="700">10,700</text>

  <line x1="72" y1="706" x2="1128" y2="706" stroke="#D3CBB9" stroke-width="1"/>

  <text x="72" y="730" fill="#586185" font-size="13">Projected openings from growth and replacement — not live vacancies. Not every trade pays six figures, and the work can be</text>
  <text x="72" y="750" fill="#586185" font-size="13">dangerous, seasonal, union-dependent, or far from home. Availability without a credible route is not opportunity.</text>
  <text x="72" y="774" fill="#9A9CA8" font-size="13">Source: BLS Occupational Outlook Handbook · 2024–34 projections · wages are May 2024 medians.</text>
</svg>
